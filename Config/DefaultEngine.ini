[ConsoleVariables]
; Pool de streaming de textures. Le defaut d'UE est 1000 Mo, une valeur pensee
; pour une carte de 2008 : le viewport affichait en rouge "POOL DE CHARGEMENT
; DYNAMIQUE DE TEXTURE SUR LE BUDGET 741,562 MiB" des que la vegetation dense a
; ete posee (la scene en demande environ 1742 Mo). La carte de cette machine a
; 24 Go de VRAM ; 4 Go de pool lui laissent 20 Go pour tout le reste. Quand le
; pool deborde, le moteur ne plante pas : il RETROGRADE les mip-maps, et les
; textures deviennent floues sans qu'on comprenne pourquoi.
r.Streaming.PoolSize=4000
; Cache PCG de l'editeur. Le defaut est 6144 Mo : PCG conserve chaque resultat
; intermediaire de chaque generation, et il remplit ce budget. Mesure au
; memreport apres une session de mise au point : PCGTextureData 23 objets pour
; ~7,9 Go de taille de ressource, PCGPointArrayData 5541 objets pour ~3,5 Go,
; alors que l'editeur ne tenait que 3,6 Go en memoire physique. Ce n'est pas une
; fuite, c'est le budget qui est genereux ; on le ramene a 2 Go, ce qui suffit
; largement pour iterer sur les recettes de vegetation.
pcg.Cache.Editor.MemoryBudgetMB=2048
; Crash RHI reproductible a l'import des couches d'un grand Landscape :
;   D3D12Util.cpp:1062 "No command list slot was available. Too many residency
;   sets are open concurrently" puis ExecuteCommandLists -> E_FAIL.
; Cause : le gestionnaire de residence D3D12 plafonne a MAX_NUM_CONCURRENT_CMD_LISTS
; = 1024 (constante de d3dx12residency.h, non configurable), alors que le defaut
; d'UE pour le nombre de command lists passees a un seul ExecuteCommandLists est
; INT_MAX (D3D12Submission.cpp). La fusion des edit layers sur un Landscape de
; 1024 composants depasse ce plafond. On borne donc la soumission sous le cap.
r.D3D12.Submission.MaxExecuteBatchSize.Direct=512
r.D3D12.Submission.MaxExecuteBatchSize.Copy=512
r.D3D12.Submission.MaxExecuteBatchSize.Async=512
; Second levier, complementaire : taille du lot de fusion des edit layers. Plus
; il est petit, moins de composants sont resolus par lot, donc moins de residency
; sets ouverts en meme temps (c'est la variante "pSet->Open() failed" du crash).
landscape.BatchedMerge.MaxResolutionPerRenderBatch=256

; Vent d'Ultra Dynamic Sky sur la vegetation : la passe de VELOCITE tombait.
; Le 11 septembre 2026, greffer Foliage_Wind_Movement sur neuf materiaux de
; feuillage a fait planter l'editeur DEUX FOIS, EXCEPTION_ACCESS_VIOLATION dans
; UnrealEditor-D3D12RHI, "Crash in runnable thread Background Worker". Le fil
; d'Ariane du journal designe la passe fautive :
;   ParallelDraw -> RenderVelocities(Opaque) -> Scene
; avec, juste avant, "Waited for PSO creation for 100.000000ms" et une douzaine
; de "Cancelled job ... with pending SubmitJob call".
; CAUSE : un materiau qui porte un WorldPositionOffset devient ecrivain de
; VELOCITE. Nos ~400 000 instances de vegetation en ont toutes gagne un d'un
; coup, et la creation des etats de pipeline correspondants a fait tomber le
; RHI. La description d'Epic decrit exactement ce cas (RendererSettings.h:972) :
;   "That performance cost is higher if many objects are using World Position
;    Offset. A forest of trees for example."
; Defaut 2 = Auto (PrimitiveSceneProxy.cpp:65) ; 0 = jamais.
; CE QUE L'ON PERD : le flou de mouvement et le TSR ne suivent plus le
; fremissement du feuillage. Sur un monde stylise cela ne se voit pas, et c'est
; l'optimisation habituelle des que le vent touche beaucoup d'objets.
r.Velocity.EnableVertexDeformation=0
