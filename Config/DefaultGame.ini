; LA POLICE D'ICONES N'EST PAS UN .UASSET, donc rien ne l'embarque toute seule.
; Sans cette ligne les icones sont la dans l'editeur et en PIE, et manquent --
; silencieusement -- dans le seul build cuit.
; Voir Content/Worldseed/Fonts/PROVENANCE.md.
+DirectoriesToAlwaysStageAsUFS=(Path="Worldseed/Fonts")

; MEME RAISON POUR LES TABLES DE NOMS : `Data/noms.json` porte les onze univers
; de sonorites du generateur, et le JEU les lit -- pas seulement l'editeur.
; Sans cette ligne le monde sortirait du build SANS AUCUN NOM, et la seule
; facon de s'en apercevoir serait d'ouvrir la carte d'un build final.
+DirectoriesToAlwaysStageAsUFS=(Path="Worldseed/Data")

